<!-- DASHBOARD -->
<!DOCTYPE html>
<html>
    <head>
        <title>Server managing panel</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="/css/style.css">
        <link rel="icon" href="/favicon.svg">

        <script src="/src/general.js"></script>

        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=logout" />
    </head>
    <body>
        <div class="topbar">
            <button onclick="faviconClicked()" id="favicon"><img src="/favicon.svg" id="favicon_img"></button>
            <p class="title"><strong>{{ server_name }}</strong></p>

            <div class="divider"></div>

            <p class="username" id="username">
                <button onclick="usermenu()" id="username_btn">{{ user_name }}</button>
                <div id="usermenu" class="usermenu hidden">
                    <a href="/logout" class="logout_btn">
                        <span class="indicator">>></span>
                        <p>Log out</p>
                        <div class="divider"></div>
                        <span class="nf nf-md-logout_variant_2"></span>
                    </a>
                </div>
            </p>
        </div>

        <div class="viewport">
            <div class="sidebar" id="sidebar">
                <a class="selected" href="/"><div></div> <span class="nf nf-md-view_dashboard_outline icon"></span> Dashboard</a>
                <a class=""><div></div><span class="nf nf-md-folder_outline icon"></span> Files</a>
                <a class=""><div></div><span class="nf nf-md-minecraft icon"></span> Minecraft</a>
            </div>

            <div class="view">
                <iframe src="/status"></iframe>
            </div>
        </div>
    </body>
</html>
