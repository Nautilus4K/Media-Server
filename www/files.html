<!-- DASHBOARD -->
<!DOCTYPE html>
<html>
    <head>
        <title>Server managing panel</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="/css/style.css">
        <link rel="stylesheet" href="/css/files.css">
        <link rel="icon" href="/favicon.svg">

        <script src="/src/general.js"></script>
        <script src="/src/files.js" defer></script>

        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=logout" />
    </head>
    <body>
        <div class="topbar">
            <button onclick="faviconClicked()" id="favicon"><img src="/favicon.svg" id="favicon_img"></button>
            <p class="title"><strong>{{ server_name }}</strong></p>

            <div class="divider"></div>

            <p class="username" id="username">
                <button onclick="usermenu()" id="username_btn">{{ user_name }}</button>
                <div id="usermenu" class="usermenu hidden">
                    <a href="/logout" class="logout_btn">
                        <span class="indicator">>></span>
                        <p>Log out</p>
                        <div class="divider"></div>
                        <span class="nf nf-md-logout_variant_2"></span>
                    </a>
                </div>
            </p>
        </div>

        <div class="viewport">
            <div class="sidebar" id="sidebar">
                <a class="" href="/"><div></div> <span class="nf nf-md-view_dashboard_outline icon"></span> Dashboard</a>
                <a class="selected" href="/files"><div></div><span class="nf nf-md-folder_outline icon"></span> Files</a>
                <a class="" href="/minecraft"><div></div><span class="nf nf-md-minecraft icon"></span> Minecraft</a>
                <a class="" href="/camera"><div></div><span class="nf nf-md-camera icon"></span> Camera</a>
            </div>

            <div class="view">
                <div class="toolbar">
                    <a href="/files{{ parent_folder }}"><span class="nf nf-md-arrow_up"></span></a>
                    <input id="path_bar" type="text" value="{{ current_path }}">
                    <button onclick="godir()"><span class="nf nf-md-arrow_right"></span></button>
                </div>
                <div class="fileview {{ file_type }}">%%files_html_area%%</div>
            </div>
        </div>
    </body>
</html>
